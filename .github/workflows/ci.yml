name: CI

on:
  push:
    branches:
      - "feature/**"
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  validar-imports:
    name: Valida imports dos módulos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar imports
        run: python -c "import poller.kafka_poller; import stream.processor"
